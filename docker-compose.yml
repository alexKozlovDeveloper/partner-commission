name: partner-commission

x-service-defaults: &service-defaults
  restart: unless-stopped
  stop_grace_period: 35s
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

x-service-environment: &service-environment
  ASPNETCORE_ENVIRONMENT: Development
  Logging__Console__FormatterName: simple

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  partners:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/PartnerCommission.Partners.Api/Dockerfile
    environment:
      <<: *service-environment
      ConnectionStrings__Db: Host=postgres;Database=partners;Username=app;Password=app
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  wallets:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/PartnerCommission.Wallets.Api/Dockerfile
    environment:
      <<: *service-environment
      ConnectionStrings__Db: Host=postgres;Database=wallets;Username=app;Password=app
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy

  commissions:
    <<: *service-defaults
    build:
      context: .
      dockerfile: src/PartnerCommission.Commissions.Api/Dockerfile
    environment:
      <<: *service-environment
      ConnectionStrings__Db: Host=postgres;Database=commissions;Username=app;Password=app
      Services__Partners: http://partners:8080/
      Services__Wallets: http://wallets:8080/
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      partners:
        condition: service_healthy
      wallets:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - partners
      - commissions
      - wallets

volumes:
  pgdata:
  prometheus-data:
