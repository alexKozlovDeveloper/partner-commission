global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: partners
    metrics_path: /metrics
    static_configs:
      - targets: ["partners:8080"]

  - job_name: commissions
    metrics_path: /metrics
    static_configs:
      - targets: ["commissions:8080"]

  - job_name: wallets
    metrics_path: /metrics
    static_configs:
      - targets: ["wallets:8080"]
